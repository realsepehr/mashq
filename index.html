<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مشق‌یار</title>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoi2YXYtNmCyKfYqiIsInNob3J0X25hbWUiOiLZhdi02YLYp9iyIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIn0=">
<style>
  :root{
    --bg:#0d1a12;
    --card:#132318;
    --card2:#16281b;
    --border:#22352a;
    --text:#f2f5f1;
    --text-dim:#8ea092;
    --text-dim2:#5e7266;
    --accent:#e08a2b;
    --accent-dim:#7a4a17;
    --radius:18px;
  }
  [data-theme="light"]{
    --bg:#f4f1ea;
    --card:#ffffff;
    --card2:#efece3;
    --border:#e2ddd0;
    --text:#1c2019;
    --text-dim:#6b6355;
    --text-dim2:#9a9282;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:background .3s,color .3s;
  }
  @font-face{
    font-family:"Vazirmatn";
    src:local("Vazirmatn");
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:90px;
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 8px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{
    width:40px;height:40px;border-radius:12px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;color:#1c1204;
    flex-shrink:0;
  }
  .brand-text h1{margin:0;font-size:17px;font-weight:800;}
  .brand-text p{margin:1px 0 0;font-size:11.5px;color:var(--text-dim);}
  .theme-btn{
    width:38px;height:38px;border-radius:12px;
    background:var(--card2);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:17px;color:var(--text);
  }
  main{flex:1;padding:14px 20px 0;}
  .page{display:none;}
  .page.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .hero{
    background:linear-gradient(135deg,var(--accent-dim),var(--accent) 140%);
    border-radius:var(--radius);
    padding:20px;
    position:relative;
    overflow:hidden;
    color:#fff5e9;
    margin-bottom:20px;
  }
  [data-theme="light"] .hero{color:#fff;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .date-chip{
    background:rgba(0,0,0,.18);
    padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  }
  .progress-circle{
    width:56px;height:56px;border-radius:50%;
    border:3px solid rgba(255,255,255,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;line-height:1.2;
  }
  .hero h2{font-size:23px;font-weight:800;margin:14px 0 4px;line-height:1.4;}
  .hero .sub{font-size:12.5px;opacity:.85;margin:0;}

  .section-title{
    display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;
  }
  .section-title h3{font-size:15px;font-weight:800;margin:0;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:0;}

  .days-row{
    display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;
  }
  .day-pill{
    flex:1;min-width:38px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:9px 2px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
    color:var(--text);
  }
  .day-pill .dname{display:block;font-size:10px;font-weight:600;color:var(--text-dim);margin-top:2px;}
  .day-pill.active{background:var(--accent);color:#1c1204;border-color:var(--accent);}
  .day-pill.active .dname{color:#3a2508;}

  .empty-state{
    text-align:center;padding:50px 10px;color:var(--text-dim);
  }
  .empty-state p:first-child{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .empty-state p{font-size:12.5px;margin:0;}

  .hw-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .hw-check{
    width:24px;height:24px;border-radius:50%;
    border:2px solid var(--text-dim2);
    flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
  }
  .hw-check.done{background:var(--accent);border-color:var(--accent);color:#1c1204;}
  .hw-body{flex:1;min-width:0;}
  .hw-title{font-weight:700;font-size:14px;}
  .hw-title.done{text-decoration:line-through;color:var(--text-dim);}
  .hw-subject{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .hw-del{background:none;border:none;color:var(--text-dim2);cursor:pointer;font-size:16px;padding:4px;}

  .week-list{display:flex;flex-direction:column;gap:12px;}
  .week-day-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
  }
  .week-day-card h4{margin:0 0 8px;font-size:13.5px;font-weight:800;color:var(--accent);}
  .week-day-card .wd-item{font-size:12.5px;padding:5px 0;border-top:1px solid var(--border);color:var(--text-dim);}
  .week-day-card .wd-item:first-of-type{border-top:none;}
  .week-day-card .wd-item.done{text-decoration:line-through;opacity:.6;}

  form.field-group{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
  label.field-label{font-size:13px;font-weight:700;color:var(--text-dim);}
  input[type=text], select{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:14px;font-family:inherit;
    width:100%;
  }
  input::placeholder{color:var(--text-dim2);}

  .theme-toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--border);
    padding:12px 14px;border-radius:12px;margin-bottom:20px;cursor:pointer;
  }
  .theme-toggle-row span{font-size:13px;font-weight:700;color:var(--accent);}

  .color-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .color-dot{
    width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  }
  .color-dot.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--bg);}

  .subject-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 2px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;
  }
  .subject-row button{background:none;border:none;color:var(--text-dim2);font-size:15px;cursor:pointer;}
  .add-subject-btn{
    display:flex;align-items:center;gap:6px;color:var(--accent);
    background:none;border:none;font-size:13.5px;font-weight:700;cursor:pointer;padding:10px 2px;font-family:inherit;
  }

  .fab-add{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    max-width:440px;width:calc(100% - 40px);
    background:var(--accent);color:#1c1204;
    border:none;border-radius:16px;padding:15px;
    font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 20px rgba(224,138,43,.3);
  }

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--border);
    display:flex;
    max-width:480px;margin:0 auto;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;padding:12px 4px 14px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--text-dim2);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;
  }
  nav.tabbar button .icon{font-size:18px;}
  nav.tabbar button.active{color:var(--accent);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg);
    width:100%;max-width:480px;
    border-radius:20px 20px 0 0;
    padding:22px 20px 26px;
    animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:800;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions button{
    flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;
  }
  .btn-cancel{background:var(--card2);color:var(--text);}
  .btn-save{background:var(--accent);color:#1c1204;}
</style>
</head>
<body data-theme="dark">
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="logo" id="logoLetter">م</div>
      <div class="brand-text">
        <h1>مشق‌یار</h1>
        <p>برنامه‌ای که با تو راه می‌آید</p>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button>
  </header>

  <main>
    <!-- TODAY PAGE -->
    <section class="page active" id="page-today">
      <div class="hero">
        <div class="hero-top">
          <span class="date-chip" id="todayDateChip">—</span>
          <div class="progress-circle"><span id="doneCount">۰</span><span>از <span id="totalCount">۰</span></span><span style="font-size:9px;">انجام‌شده</span></div>
        </div>
        <h2>امروز رو<br>خودت بساز.</h2>
        <p class="sub" id="heroGreeting">صبح بخیر</p>
      </div>

      <div class="section-title">
        <h3>مشق‌های امروز</h3>
        <button class="link-btn" onclick="goTo('program')">برنامه هفتگی</button>
      </div>

      <div class="days-row" id="daysRow"></div>

      <div id="todayList"></div>
    </section>

    <!-- PROGRAM PAGE -->
    <section class="page" id="page-program">
      <div class="section-title" style="margin-top:6px;">
        <h3 style="font-size:19px;">برنامه هفتگی</h3>
      </div>
      <div class="week-list" id="weekList"></div>
    </section>

    <!-- PERSONALIZE PAGE -->
    <section class="page" id="page-personalize">
      <div class="section-title" style="margin-top:6px;">
        <h3 style="font-size:19px;">شخصی‌سازی</h3>
      </div>

      <div class="field-group">
        <label class="field-label">اسم</label>
        <input type="text" id="nameInput" placeholder="اسمت رو وارد کن">
      </div>

      <label class="field-label" style="margin-bottom:8px;display:block;">تم</label>
      <div class="theme-toggle-row" onclick="toggleTheme()">
        <span>تغییر بین تم تیره و روشن</span>
        <span id="themeIcon2">☀️</span>
      </div>

      <label class="field-label" style="margin-bottom:8px;display:block;">رنگ تم</label>
      <div class="color-row" id="colorRow"></div>

      <label class="field-label" style="margin-bottom:8px;display:block;">درس‌ها</label>
      <div id="subjectList"></div>
      <button class="add-subject-btn" onclick="addSubjectPrompt()">＋ افزودن درس</button>
    </section>
  </main>

  <button class="fab-add" onclick="openAddModal()">افزودن مشق</button>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="today" onclick="goTo('today')">
      <span class="icon">🏠</span>امروز
    </button>
    <button class="tab-btn" data-tab="program" onclick="goTo('program')">
      <span class="icon">☰</span>برنامه
    </button>
    <button class="tab-btn" data-tab="personalize" onclick="goTo('personalize')">
      <span class="icon">＋</span>شخصی‌سازی
    </button>
  </nav>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>افزودن مشق</h3>
    <div class="field-group">
      <label class="field-label">عنوان مشق</label>
      <input type="text" id="hwTitleInput" placeholder="مثلاً: حل تمرین صفحه ۲۰">
    </div>
    <div class="field-group">
      <label class="field-label">درس</label>
      <select id="hwSubjectInput"></select>
    </div>
    <div class="field-group">
      <label class="field-label">روز</label>
      <select id="hwDayInput"></select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">انصراف</button>
      <button class="btn-save" onclick="saveHomework()">ذخیره</button>
    </div>
  </div>
</div>

<script>
const THEME_COLORS = [
  {name:'red', val:'#e0543f'},
  {name:'orange', val:'#e08a2b'},
  {name:'green', val:'#3fae5c'},
  {name:'teal', val:'#2bb0a8'},
  {name:'blue', val:'#3b82e0'},
  {name:'purple', val:'#8a6be0'},
  {name:'pink', val:'#c25bb0'},
  {name:'gold', val:'#d4a017'}
];
const DAY_NAMES = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const DAY_LETTERS = ['ش','ی','د','س','چ','پ','ج'];
const PERSIAN_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function toPersianDigits(n){
  return String(n).replace(/[0-9]/g, d => PERSIAN_DIGITS[d]);
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem('mashqyar_state');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    name:'',
    theme:'dark',
    color:'orange',
    subjects:['ریاضی','فارسی','علوم'],
    homework:[], // {id, title, subject, day(0-6), done}
    selectedDay: new Date().getDay() === 6 ? 0 : new Date().getDay()+1 // map to sat=0
  };
}
function saveState(){
  localStorage.setItem('mashqyar_state', JSON.stringify(state));
}

function applyTheme(){
  document.body.setAttribute('data-theme', state.theme);
  const c = THEME_COLORS.find(c=>c.name===state.color) || THEME_COLORS[1];
  document.documentElement.style.setProperty('--accent', c.val);
  // dim version
  document.documentElement.style.setProperty('--accent-dim', shade(c.val, -0.55));
  document.getElementById('themeBtn').textContent = state.theme==='dark' ? '☀️' : '🌙';
  document.getElementById('themeIcon2').textContent = state.theme==='dark' ? '☀️' : '🌙';
}
function shade(hex, percent){
  let f = parseInt(hex.slice(1),16), t = percent<0?0:255, p = Math.abs(percent);
  let R = f>>16, G = f>>8&0x00FF, B = f&0x0000FF;
  const nr = Math.round((t-R)*p)+R, ng = Math.round((t-G)*p)+G, nb = Math.round((t-B)*p)+B;
  return "#"+(0x1000000+nr*0x10000+ng*0x100+nb).toString(16).slice(1);
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  saveState(); applyTheme();
}

function goTo(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  window.scrollTo(0,0);
}

function renderHeader(){
  const now = new Date();
  const weekdayIdx = now.getDay()===6?0:now.getDay()+1;
  document.getElementById('todayDateChip').textContent = DAY_NAMES[weekdayIdx] + ' ' + toPersianDigits(now.getDate()) + ' ' + persianMonthApprox(now);
  document.getElementById('logoLetter').textContent = state.name ? state.name[0] : 'م';
  const greetings = ['صبح بخیر','ظهر بخیر','عصر بخیر','شب بخیر'];
  const h = now.getHours();
  const g = h<12?greetings[0]:h<16?greetings[1]:h<20?greetings[2]:greetings[3];
  document.getElementById('heroGreeting').textContent = state.name ? (g+'، '+state.name) : g;
}
function persianMonthApprox(now){
  // Just show month name in Persian-ish using Gregorian fallback label "شهریور" style is complex;
  // Use Intl if available for Persian calendar
  try{
    const fmt = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {month:'long'});
    return fmt.format(now);
  }catch(e){ return ''; }
}

function renderDaysRow(){
  const row = document.getElementById('daysRow');
  row.innerHTML = '';
  for(let i=0;i<7;i++){
    const pill = document.createElement('div');
    pill.className = 'day-pill' + (state.selectedDay===i ? ' active':'');
    pill.innerHTML = toPersianDigits(14+i) + '<span class="dname">'+DAY_LETTERS[i]+'</span>';
    pill.onclick = ()=>{ state.selectedDay = i; saveState(); renderDaysRow(); renderTodayList(); };
    row.appendChild(pill);
  }
}

function renderTodayList(){
  const list = document.getElementById('todayList');
  const items = state.homework.filter(h=>h.day===state.selectedDay);
  const done = items.filter(h=>h.done).length;
  document.getElementById('doneCount').textContent = toPersianDigits(done);
  document.getElementById('totalCount').textContent = toPersianDigits(items.length);

  if(items.length===0){
    list.innerHTML = '<div class="empty-state"><p>هنوز مشقی نداری</p><p>با دکمه‌ی افزودن مشق شروع کن</p></div>';
    return;
  }
  list.innerHTML = '';
  items.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'hw-card';
    card.innerHTML = `
      <div class="hw-check ${item.done?'done':''}">${item.done?'✓':''}</div>
      <div class="hw-body">
        <div class="hw-title ${item.done?'done':''}">${escapeHtml(item.title)}</div>
        <div class="hw-subject">${escapeHtml(item.subject)}</div>
      </div>
      <button class="hw-del">✕</button>
    `;
    card.querySelector('.hw-check').onclick = ()=>{ item.done=!item.done; saveState(); renderTodayList(); renderWeekList(); };
    card.querySelector('.hw-del').onclick = ()=>{ state.homework = state.homework.filter(h=>h.id!==item.id); saveState(); renderTodayList(); renderWeekList(); };
    list.appendChild(card);
  });
}

function renderWeekList(){
  const wl = document.getElementById('weekList');
  wl.innerHTML = '';
  for(let d=0; d<7; d++){
    const items = state.homework.filter(h=>h.day===d);
    const card = document.createElement('div');
    card.className = 'week-day-card';
    let inner = `<h4>${DAY_NAMES[d]}</h4>`;
    if(items.length===0){
      inner += `<div class="wd-item">مشقی ثبت نشده</div>`;
    }else{
      items.forEach(it=>{
        inner += `<div class="wd-item ${it.done?'done':''}">${escapeHtml(it.subject)} — ${escapeHtml(it.title)}</div>`;
      });
    }
    card.innerHTML = inner;
    wl.appendChild(card);
  }
}

function renderPersonalize(){
  document.getElementById('nameInput').value = state.name;
  const cr = document.getElementById('colorRow');
  cr.innerHTML = '';
  THEME_COLORS.forEach(c=>{
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (state.color===c.name?' selected':'');
    dot.style.background = c.val;
    dot.onclick = ()=>{ state.color=c.name; saveState(); applyTheme(); renderPersonalize(); };
    cr.appendChild(dot);
  });
  renderSubjectList();
}

function renderSubjectList(){
  const sl = document.getElementById('subjectList');
  sl.innerHTML = '';
  state.subjects.forEach((s,idx)=>{
    const row = document.createElement('div');
    row.className = 'subject-row';
    row.innerHTML = `<span>${escapeHtml(s)}</span><button>✕</button>`;
    row.querySelector('button').onclick = ()=>{
      state.subjects.splice(idx,1); saveState(); renderSubjectList(); populateHwSubjectSelect();
    };
    sl.appendChild(row);
  });
}
function addSubjectPrompt(){
  const val = prompt('نام درس جدید را وارد کن:');
  if(val && val.trim()){
    state.subjects.push(val.trim());
    saveState(); renderSubjectList(); populateHwSubjectSelect();
  }
}

document.getElementById('nameInput').addEventListener('input', e=>{
  state.name = e.target.value; saveState(); renderHeader();
});

function populateHwSubjectSelect(){
  const sel = document.getElementById('hwSubjectInput');
  sel.innerHTML = '';
  if(state.subjects.length===0){
    const opt = document.createElement('option');
    opt.textContent = 'ابتدا یک درس اضافه کن'; opt.disabled=true; opt.selected=true;
    sel.appendChild(opt);
    return;
  }
  state.subjects.forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}
function populateHwDaySelect(){
  const sel = document.getElementById('hwDayInput');
  sel.innerHTML = '';
  DAY_NAMES.forEach((d,idx)=>{
    const opt = document.createElement('option');
    opt.value = idx; opt.textContent = d;
    if(idx===state.selectedDay) opt.selected = true;
    sel.appendChild(opt);
  });
}

function openAddModal(){
  populateHwSubjectSelect();
  populateHwDaySelect();
  document.getElementById('hwTitleInput').value = '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeAddModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}
function saveHomework(){
  const title = document.getElementById('hwTitleInput').value.trim();
  const subject = document.getElementById('hwSubjectInput').value;
  const day = parseInt(document.getElementById('hwDayInput').value, 10);
  if(!title){ alert('لطفاً عنوان مشق را وارد کن'); return; }
  if(!subject){ alert('لطفاً یک درس انتخاب کن (از بخش شخصی‌سازی درس اضافه کن)'); return; }
  state.homework.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2), title, subject, day, done:false });
  saveState();
  closeAddModal();
  renderTodayList();
  renderWeekList();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// init
applyTheme();
renderHeader();
renderDaysRow();
renderTodayList();
renderWeekList();
renderPersonalize();
</script>
</body>
</html>
