<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مشق‌یار</title>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoi2YXYtNmCyKfYqiIsInNob3J0X25hbWUiOiLZhdi02YLYp9iyIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIn0=">
<style>
  :root{
    --bg:#0d1a12;
    --card:#132318;
    --card2:#16281b;
    --border:#22352a;
    --text:#f2f5f1;
    --text-dim:#8ea092;
    --text-dim2:#5e7266;
    --accent:#e08a2b;
    --accent-dim:#7a4a17;
    --radius:18px;
  }
  [data-theme="light"]{
    --bg:#f4f1ea;
    --card:#ffffff;
    --card2:#efece3;
    --border:#e2ddd0;
    --text:#1c2019;
    --text-dim:#6b6355;
    --text-dim2:#9a9282;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:background .3s,color .3s;
  }
  @font-face{
    font-family:"Vazirmatn";
    src:local("Vazirmatn");
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding-bottom:90px;
    position:relative;
  }
  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 8px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .logo{
    width:40px;height:40px;border-radius:12px;
    background:#16281b;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-text h1{margin:0;font-size:17px;font-weight:800;}
  .brand-text p{margin:1px 0 0;font-size:11.5px;color:var(--text-dim);}
  .theme-btn{
    width:38px;height:38px;border-radius:12px;
    background:var(--card2);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:17px;color:var(--text);
  }
  main{flex:1;padding:14px 20px 0;}
  .page{display:none;}
  .page.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .hero{
    background:linear-gradient(135deg,var(--accent-dim),var(--accent) 140%);
    border-radius:var(--radius);
    padding:20px;
    position:relative;
    overflow:hidden;
    color:#fff5e9;
    margin-bottom:20px;
  }
  [data-theme="light"] .hero{color:#fff;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;}
  .date-chip{
    background:rgba(0,0,0,.18);
    padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;
  }
  .progress-circle{
    width:56px;height:56px;border-radius:50%;
    border:3px solid rgba(255,255,255,.35);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;line-height:1.2;
  }
  .hero h2{font-size:23px;font-weight:800;margin:14px 0 4px;line-height:1.4;}
  .hero .sub{font-size:12.5px;opacity:.85;margin:0;}

  .section-title{
    display:flex;justify-content:space-between;align-items:center;margin:6px 0 12px;
  }
  .section-title h3{font-size:15px;font-weight:800;margin:0;}
  .link-btn{background:none;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:0;}

  .days-row{
    display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;
  }
  .day-pill{
    flex:1;min-width:38px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:9px 2px;
    text-align:center;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
    color:var(--text);
  }
  .day-pill .dname{display:block;font-size:10px;font-weight:600;color:var(--text-dim);margin-top:2px;}
  .day-pill.active{background:var(--accent);color:#1c1204;border-color:var(--accent);}
  .day-pill.active .dname{color:#3a2508;}

  .empty-state{
    text-align:center;padding:50px 10px;color:var(--text-dim);
  }
  .empty-state p:first-child{font-size:14.5px;font-weight:700;color:var(--text);margin-bottom:6px;}
  .empty-state p{font-size:12.5px;margin:0;}

  .hw-card{
    background:var(--card);
    border:1px solid var(--border);
    border-inline-start:4px solid var(--subject-color, var(--border));
    border-radius:14px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
  }
  .hw-check{
    width:24px;height:24px;border-radius:50%;
    border:2px solid var(--text-dim2);
    flex-shrink:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
  }
  .hw-check.done{background:var(--accent);border-color:var(--accent);color:#1c1204;}
  .hw-body{flex:1;min-width:0;}
  .hw-title{font-weight:700;font-size:14px;}
  .hw-title.done{text-decoration:line-through;color:var(--text-dim);}
  .hw-subject{font-size:11.5px;color:var(--text-dim);margin-top:2px;display:flex;align-items:center;gap:5px;}
  .subject-dot{width:8px;height:8px;border-radius:50%;background:var(--subject-color, var(--text-dim2));flex-shrink:0;}
  .hw-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .hw-timer-btn{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:17px;padding:4px;}
  .hw-del{background:none;border:none;color:var(--text-dim2);cursor:pointer;font-size:16px;padding:4px;}

  .week-list{display:flex;flex-direction:column;gap:12px;}
  .week-day-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;
  }
  .week-day-card h4{margin:0 0 8px;font-size:13.5px;font-weight:800;color:var(--accent);}
  .week-day-card .wd-item{font-size:12.5px;padding:5px 0;border-top:1px solid var(--border);color:var(--text-dim);display:flex;align-items:center;gap:6px;}
  .week-day-card .wd-item:first-of-type{border-top:none;}
  .week-day-card .wd-item.done{text-decoration:line-through;opacity:.6;}

  form.field-group{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;}
  label.field-label{font-size:13px;font-weight:700;color:var(--text-dim);}
  input[type=text], select{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:14px;font-family:inherit;
    width:100%;
  }
  input::placeholder{color:var(--text-dim2);}

  .theme-toggle-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--border);
    padding:12px 14px;border-radius:12px;margin-bottom:20px;cursor:pointer;
  }
  .theme-toggle-row span{font-size:13px;font-weight:700;color:var(--accent);}

  .color-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
  .color-dot{
    width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  }
  .color-dot.selected{border-color:var(--text);box-shadow:0 0 0 2px var(--bg);}

  .subject-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 2px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;
  }
  .subject-row button{background:none;border:none;color:var(--text-dim2);font-size:15px;cursor:pointer;}
  .add-subject-btn{
    display:flex;align-items:center;gap:6px;color:var(--accent);
    background:none;border:none;font-size:13.5px;font-weight:700;cursor:pointer;padding:10px 2px;font-family:inherit;
  }

  .fab-add{
    position:fixed;bottom:78px;left:50%;transform:translateX(-50%);
    max-width:440px;width:calc(100% - 40px);
    background:var(--accent);color:#1c1204;
    border:none;border-radius:16px;padding:15px;
    font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 20px rgba(224,138,43,.3);
  }

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--border);
    display:flex;
    max-width:480px;margin:0 auto;
  }
  nav.tabbar button{
    flex:1;background:none;border:none;padding:12px 4px 14px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    color:var(--text-dim2);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;
  }
  nav.tabbar button .icon{display:flex;align-items:center;justify-content:center;}
  nav.tabbar button.active{color:var(--accent);}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.5);
    display:none;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg);
    width:100%;max-width:480px;
    border-radius:20px 20px 0 0;
    padding:22px 20px 26px;
    animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal h3{margin:0 0 16px;font-size:16px;font-weight:800;}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions button{
    flex:1;padding:12px;border-radius:12px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;
  }
  .btn-cancel{background:var(--card2);color:var(--text);}
  .btn-save{background:var(--accent);color:#1c1204;}

  /* Pomodoro timer modal */
  .timer-modal .modal{text-align:center;}
  .timer-subject{font-size:12.5px;color:var(--text-dim);margin-bottom:2px;}
  .timer-title{font-size:15px;font-weight:800;margin-bottom:18px;}
  .timer-display{
    font-size:52px;font-weight:800;letter-spacing:2px;
    margin:10px 0 6px;font-variant-numeric:tabular-nums;
    direction:ltr;
  }
  .timer-phase{font-size:12.5px;color:var(--accent);font-weight:700;margin-bottom:18px;}
  .timer-ring{
    width:180px;height:180px;margin:0 auto 6px;position:relative;
  }
  .timer-ring svg{transform:rotate(-90deg);width:100%;height:100%;}
  .timer-ring circle{fill:none;stroke-width:8;}
  .timer-ring .bg-circle{stroke:var(--border);}
  .timer-ring .progress-circle-ring{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .timer-ring .timer-display{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;}
  .timer-controls{display:flex;gap:10px;margin-top:18px;}
  .timer-controls button{
    flex:1;padding:13px;border-radius:12px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;font-family:inherit;
  }
  .timer-btn-primary{background:var(--accent);color:#1c1204;}
  .timer-btn-secondary{background:var(--card2);color:var(--text);}
  .timer-presets{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
  .timer-preset{
    background:var(--card2);border:1px solid var(--border);color:var(--text-dim);
    padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .timer-preset.active{background:var(--accent);color:#1c1204;border-color:var(--accent);}
</style>
</head>

<div class="app">

    <div class="brand">

    <div class="field-group">
      <label class="field-label">عنوان مشق</label>
      <input type="text" id="hwTitleInput" placeholder="مثلاً: حل تمرین صفحه ۲۰">
    </div>
    <div class="field-group">
      <label class="field-label">درس</label>
      <select id="hwSubjectInput"></select>
    </div>

      <select id="hwDayInput"></select>
    </div>

      <button class="btn-save" onclick="saveHomework()">ذخیره</button>
    </div>
  </div>

<script>
const THEME_COLORS = [
  {name:'red', val:'#e0543f'},
  {name:'orange', val:'#e08a2b'},
  {name:'green', val:'#3fae5c'},
  {name:'teal', val:'#2bb0a8'},
  {name:'blue', val:'#3b82e0'},
  {name:'purple', val:'#8a6be0'},
  {name:'pink', val:'#c25bb0'},
  {name:'gold', val:'#d4a017'}
];
const SUBJECT_COLOR_PALETTE = ['#e0543f','#e08a2b','#3fae5c','#2bb0a8','#3b82e0','#8a6be0','#c25bb0','#d4a017','#4f9d69','#c2634a'];
function subjectColor(name){
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = name.charCodeAt(i) + ((hash<<5)-hash); }
  const idx = Math.abs(hash) % SUBJECT_COLOR_PALETTE.length;
  return SUBJECT_COLOR_PALETTE[idx];
}
const DAY_NAMES = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const DAY_LETTERS = ['ش','ی','د','س','چ','پ','ج'];
const PERSIAN_DIGITS = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];

function toPersianDigits(n){
  return String(n).replace(/[0-9]/g, d => PERSIAN_DIGITS[d]);
}

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem('mashqyar_state');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {
    name:'',
    theme:'dark',
    color:'orange',
    subjects:['ریاضی','فارسی','علوم'],
    homework:[], // {id, title, subject, day(0-6), done}
    selectedDay: new Date().getDay() === 6 ? 0 : new Date().getDay()+1 // map to sat=0
  };
}
function saveState(){
  localStorage.setItem('mashqyar_state', JSON.stringify(state));
}

function applyTheme(){
  document.body.setAttribute('data-theme', state.theme);
  const c = THEME_COLORS.find(c=>c.name===state.color) || THEME_COLORS[1];
  document.documentElement.style.setProperty('--accent', c.val);
  // dim version
  document.documentElement.style.setProperty('--accent-dim', shade(c.val, -0.55));
  document.getElementById('themeBtn').textContent = state.theme==='dark' ? '☀️' : '🌙';
  document.getElementById('themeIcon2').textContent = state.theme==='dark' ? '☀️' : '🌙';
}
function shade(hex, percent){
  let f = parseInt(hex.slice(1),16), t = percent<0?0:255, p = Math.abs(percent);
  let R = f>>16, G = f>>8&0x00FF, B = f&0x0000FF;
  const nr = Math.round((t-R)*p)+R, ng = Math.round((t-G)*p)+G, nb = Math.round((t-B)*p)+B;
  return "#"+(0x1000000+nr*0x10000+ng*0x100+nb).toString(16).slice(1);
}
function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  saveState(); applyTheme();
}

function goTo(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  window.scrollTo(0,0);
}

function renderHeader(){
  const now = new Date();
  const weekdayIdx = now.getDay()===6?0:now.getDay()+1;
  document.getElementById('todayDateChip').textContent = DAY_NAMES[weekdayIdx] + ' ' + toPersianDigits(now.getDate()) + ' ' + persianMonthApprox(now);
  const greetings = ['صبح بخیر','ظهر بخیر','عصر بخیر','شب بخیر'];
  const h = now.getHours();
  const g = h<12?greetings[0]:h<16?greetings[1]:h<20?greetings[2]:greetings[3];
  document.getElementById('heroGreeting').textContent = state.name ? (g+'، '+state.name) : g;
}
function persianMonthApprox(now){
  // Just show month name in Persian-ish using Gregorian fallback label "شهریور" style is complex;
  // Use Intl if available for Persian calendar
  try{
    const fmt = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {month:'long'});
    return fmt.format(now);
  }catch(e){ return ''; }
}

function renderDaysRow(){
  const row = document.getElementById('daysRow');
  row.innerHTML = '';
  for(let i=0;i<7;i++){
    const pill = document.createElement('div');
    pill.className = 'day-pill' + (state.selectedDay===i ? ' active':'');
    pill.innerHTML = toPersianDigits(14+i) + '<span class="dname">'+DAY_LETTERS[i]+'</span>';
    pill.onclick = ()=>{ state.selectedDay = i; saveState(); renderDaysRow(); renderTodayList(); };
    row.appendChild(pill);
  }
}

function renderTodayList(){
  const list = document.getElementById('todayList');
  const items = state.homework.filter(h=>h.day===state.selectedDay);
  const done = items.filter(h=>h.done).length;
  document.getElementById('doneCount').textContent = toPersianDigits(done);
  document.getElementById('totalCount').textContent = toPersianDigits(items.length);

  if(items.length===0){
    list.innerHTML = '<div class="empty-state"><p>هنوز مشقی نداری</p><p>با دکمه‌ی افزودن مشق شروع کن</p></div>';
    return;
  }
  list.innerHTML = '';
  items.forEach(item=>{
    const color = subjectColor(item.subject);
    const card = document.createElement('div');
    card.className = 'hw-card';
    card.style.setProperty('--subject-color', color);
    card.innerHTML = `
      <div class="hw-check ${item.done?'done':''}">${item.done?'✓':''}</div>
      <div class="hw-body">
        <div class="hw-title ${item.done?'done':''}">${escapeHtml(item.title)}</div>
        <div class="hw-subject"><span class="subject-dot"></span>${escapeHtml(item.subject)}</div>
      </div>
      <div class="hw-actions">
        <button class="hw-timer-btn" title="تایمر مطالعه">⏱️</button>
        <button class="hw-del">✕</button>
      </div>
    `;
    card.querySelector('.hw-check').onclick = ()=>{ item.done=!item.done; saveState(); renderTodayList(); renderWeekList(); };
    card.querySelector('.hw-del').onclick = ()=>{ state.homework = state.homework.filter(h=>h.id!==item.id); saveState(); renderTodayList(); renderWeekList(); };
    card.querySelector('.hw-timer-btn').onclick = ()=> openTimer(item);
    list.appendChild(card);
  });
}

function renderWeekList(){
  const wl = document.getElementById('weekList');
  wl.innerHTML = '';
  for(let d=0; d<7; d++){
    const items = state.homework.filter(h=>h.day===d);
    const card = document.createElement('div');
    card.className = 'week-day-card';
    let inner = `<h4>${DAY_NAMES[d]}</h4>`;
    if(items.length===0){
      inner += `<div class="wd-item">مشقی ثبت نشده</div>`;
    }else{
      items.forEach(it=>{
        const color = subjectColor(it.subject);
        inner += `<div class="wd-item ${it.done?'done':''}"><span class="subject-dot" style="background:${color}"></span>${escapeHtml(it.subject)} — ${escapeHtml(it.title)}</div>`;
      });
    }
    card.innerHTML = inner;
    wl.appendChild(card);
  }
}

function renderPersonalize(){
  document.getElementById('nameInput').value = state.name;
  const cr = document.getElementById('colorRow');
  cr.innerHTML = '';
  THEME_COLORS.forEach(c=>{
    const dot = document.createElement('div');
    dot.className = 'color-dot' + (state.color===c.name?' selected':'');
    dot.style.background = c.val;
    dot.onclick = ()=>{ state.color=c.name; saveState(); applyTheme(); renderPersonalize(); };
    cr.appendChild(dot);
  });
  renderSubjectList();
}

function renderSubjectList(){
  const sl = document.getElementById('subjectList');
  sl.innerHTML = '';
  state.subjects.forEach((s,idx)=>{
    const row = document.createElement('div');
    row.className = 'subject-row';
    row.innerHTML = `<span>${escapeHtml(s)}</span><button>✕</button>`;
    row.querySelector('button').onclick = ()=>{
      state.subjects.splice(idx,1); saveState(); renderSubjectList(); populateHwSubjectSelect();
    };
    sl.appendChild(row);
  });
}
function addSubjectPrompt(){
  const val = prompt('نام درس جدید را وارد کن:');
  if(val && val.trim()){
    state.subjects.push(val.trim());
    saveState(); renderSubjectList(); populateHwSubjectSelect();
  }
}

document.getElementById('nameInput').addEventListener('input', e=>{
  state.name = e.target.value; saveState(); renderHeader();
});

function populateHwSubjectSelect(){
  const sel = document.getElementById('hwSubjectInput');
  sel.innerHTML = '';
  if(state.subjects.length===0){
    const opt = document.createElement('option');
    opt.textContent = 'ابتدا یک درس اضافه کن'; opt.disabled=true; opt.selected=true;
    sel.appendChild(opt);
    return;
  }
  state.subjects.forEach(s=>{
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}
function populateHwDaySelect(){
  const sel = document.getElementById('hwDayInput');
  sel.innerHTML = '';
  DAY_NAMES.forEach((d,idx)=>{
    const opt = document.createElement('option');
    opt.value = idx; opt.textContent = d;
    if(idx===state.selectedDay) opt.selected = true;
    sel.appendChild(opt);
  });
}

function openAddModal(){
  populateHwSubjectSelect();
  populateHwDaySelect();
  document.getElementById('hwTitleInput').value = '';
  document.getElementById('modalOverlay').classList.add('open');
}
function closeAddModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}
function saveHomework(){
  const title = document.getElementById('hwTitleInput').value.trim();
  const subject = document.getElementById('hwSubjectInput').value;
  const day = parseInt(document.getElementById('hwDayInput').value, 10);
  if(!title){ alert('لطفاً عنوان مشق را وارد کن'); return; }
  if(!subject){ alert('لطفاً یک درس انتخاب کن (از بخش شخصی‌سازی درس اضافه کن)'); return; }
  state.homework.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2), title, subject, day, done:false });
  saveState();
  closeAddModal();
  renderTodayList();
  renderWeekList();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---------- Pomodoro timer ----------
const TIMER_PRESETS = [
  {label:'۱۵', minutes:15},
  {label:'۲۵', minutes:25},
  {label:'۴۵', minutes:45}
];
let timerState = {
  totalSeconds: 25*60,
  remaining: 25*60,
  running: false,
  intervalId: null,
  item: null,
  phase: 'focus' // focus | break
};
const RING_CIRCUMFERENCE = 2 * Math.PI * 80;

function openTimer(item){
  timerState.item = item;
  timerState.running = false;
  timerState.phase = 'focus';
  const preset = TIMER_PRESETS[1];
  timerState.totalSeconds = preset.minutes*60;
  timerState.remaining = preset.totalSeconds || preset.minutes*60;
  timerState.remaining = preset.minutes*60;
  clearInterval(timerState.intervalId);

  document.getElementById('timerSubject').textContent = item.subject;
  document.getElementById('timerTitle').textContent = item.title;
  document.getElementById('timerPhase').textContent = 'آماده‌ی شروع';
  document.getElementById('timerStartBtn').textContent = 'شروع';
  renderTimerPresets();
  updateTimerDisplay();
  document.getElementById('timerOverlay').classList.add('open');
}

function renderTimerPresets(){
  const wrap = document.getElementById('timerPresets');
  wrap.innerHTML = '';
  TIMER_PRESETS.forEach(p=>{
    const btn = document.createElement('button');
    btn.className = 'timer-preset' + (timerState.totalSeconds === p.minutes*60 ? ' active' : '');
    btn.textContent = p.label + ' دقیقه';
    btn.onclick = ()=>{
      if(timerState.running) return;
      timerState.totalSeconds = p.minutes*60;
      timerState.remaining = p.minutes*60;
      timerState.phase = 'focus';
      document.getElementById('timerPhase').textContent = 'آماده‌ی شروع';
      renderTimerPresets();
      updateTimerDisplay();
    };
    wrap.appendChild(btn);
  });
}

function updateTimerDisplay(){
  const m = Math.floor(timerState.remaining/60);
  const s = timerState.remaining%60;
  const txt = toPersianDigits(String(m).padStart(2,'0')) + ':' + toPersianDigits(String(s).padStart(2,'0'));
  document.getElementById('timerDisplay').textContent = txt;
  const ring = document.getElementById('timerRingProgress');
  const fraction = timerState.remaining / timerState.totalSeconds;
  ring.style.strokeDasharray = RING_CIRCUMFERENCE;
  ring.style.strokeDashoffset = RING_CIRCUMFERENCE * (1-fraction);
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    o.start();
    o.frequency.exponentialRampToValueAtTime(440, ctx.currentTime+0.4);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
    o.stop(ctx.currentTime+0.6);
  }catch(e){}
}

function tickTimer(){
  timerState.remaining--;
  if(timerState.remaining <= 0){
    playBeep();
    if(timerState.phase === 'focus'){
      timerState.phase = 'break';
      timerState.totalSeconds = 5*60;
      timerState.remaining = 5*60;
      document.getElementById('timerPhase').textContent = 'وقت استراحت ☕';
    }else{
      clearInterval(timerState.intervalId);
      timerState.running = false;
      timerState.phase = 'focus';
      timerState.totalSeconds = 25*60;
      timerState.remaining = 25*60;
      document.getElementById('timerPhase').textContent = 'آماده‌ی شروع';
      document.getElementById('timerStartBtn').textContent = 'شروع';
      renderTimerPresets();
    }
  }
  updateTimerDisplay();
}

document.getElementById('timerStartBtn').addEventListener('click', ()=>{
  if(timerState.running){
    timerState.running = false;
    clearInterval(timerState.intervalId);
    document.getElementById('timerStartBtn').textContent = 'ادامه';
    document.getElementById('timerPhase').textContent = 'مکث شده';
  }else{
    timerState.running = true;
    if(timerState.phase==='focus' && timerState.remaining===timerState.totalSeconds){
      document.getElementById('timerPhase').textContent = 'در حال مطالعه… 🎯';
    }else if(timerState.phase==='focus'){
      document.getElementById('timerPhase').textContent = 'در حال مطالعه… 🎯';
    }
    document.getElementById('timerStartBtn').textContent = 'مکث';
    timerState.intervalId = setInterval(tickTimer, 1000);
  }
});
document.getElementById('timerResetBtn').addEventListener('click', ()=>{
  clearInterval(timerState.intervalId);
  timerState.running = false;
  timerState.phase = 'focus';
  const preset = TIMER_PRESETS[1];
  timerState.totalSeconds = preset.minutes*60;
  timerState.remaining = preset.minutes*60;
  document.getElementById('timerPhase').textContent = 'آماده‌ی شروع';
  document.getElementById('timerStartBtn').textContent = 'شروع';
  renderTimerPresets();
  updateTimerDisplay();
});
document.getElementById('timerCloseBtn').addEventListener('click', ()=>{
  clearInterval(timerState.intervalId);
  timerState.running = false;
  document.getElementById('timerOverlay').classList.remove('open');
});

// init
applyTheme();
renderHeader();
renderDaysRow();
renderTodayList();
renderWeekList();
renderPersonalize();
</script>
